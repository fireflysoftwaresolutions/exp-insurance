  /api/v1/experience/insurance/policies:
    post:
      tags:
      - insurance-controller
      summary: Check insurance binding prerequisites
      description: Binding is unavailable until authoritative quote acceptance and
        recoverable policy/document integration are connected
      operationId: bind
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: Compatibility header; this route does not cache responses or
          derive authority from it.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCommand"
        required: true
      responses:
        "201":
          description: Reserved legacy success schema; binding is currently unavailable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InsuranceRecord"
        "400":
          description: An explicit party identifier is required
        "409":
          description: Referral requires an authorized resolution before binding
        "422":
          description: Configured decision declined the operation
        "503":
          description: "Required decision is unavailable, or approved binding is fenced\
            \ before policy and document effects"
      x-disable-idempotency: true
