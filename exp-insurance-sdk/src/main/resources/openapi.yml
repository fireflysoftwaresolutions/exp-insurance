components:
  schemas:
    QuoteCommand:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        submissionNumber:
          type: string
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        submissionStatus:
          type: string
          enum:
          - RECEIVED
          - IN_CLEARANCE
          - REFERRED
          - QUOTED
          - BOUND
          - DECLINED
          - WITHDRAWN
        currency:
          type: string
    InsuranceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        status:
          type: string
        documentId:
          type: string
          format: uuid
    QuoteStatusBody:
      type: object
      properties:
        status:
          type: string
          enum:
          - RECEIVED
          - IN_CLEARANCE
          - REFERRED
          - QUOTED
          - BOUND
          - DECLINED
          - WITHDRAWN
        reason:
          type: string
    PolicyCommand:
      required:
      - partyId
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        policyNumber:
          type: string
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        policyStatus:
          type: string
          enum:
          - QUOTE
          - BOUND
          - IN_FORCE
          - LAPSED
          - CANCELLED
          - EXPIRED
        inceptionDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        currency:
          type: string
    PolicyStatusBody:
      type: object
      properties:
        status:
          type: string
          enum:
          - QUOTE
          - BOUND
          - IN_FORCE
          - LAPSED
          - CANCELLED
          - EXPIRED
        reason:
          type: string
    ClaimCommand:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        claimNumber:
          type: string
        claimStatus:
          type: string
          enum:
          - NOTIFIED
          - OPEN
          - UNDER_ASSESSMENT
          - RESERVED
          - SETTLED
          - CLOSED
          - REOPENED
          - DENIED
        lossDate:
          type: string
          format: date
        notifiedAt:
          type: string
          format: date-time
        causeCode:
          type: string
        description:
          type: string
        currency:
          type: string
    ClaimStatusBody:
      type: object
      properties:
        status:
          type: string
          enum:
          - NOTIFIED
          - OPEN
          - UNDER_ASSESSMENT
          - RESERVED
          - SETTLED
          - CLOSED
          - REOPENED
          - DENIED
        reason:
          type: string
    ReasonCommand:
      type: object
      properties:
        reason:
          type: string
