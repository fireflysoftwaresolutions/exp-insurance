spring:
  application:
    name: exp-insurance
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

firefly:
  cache:
    enabled: true
    redis:
      enabled: false
    default-cache-type: POSTGRES
    postgres:
      enabled: true
      host: ${CACHE_DB_HOST:localhost}
      port: ${CACHE_DB_PORT:5432}
      database: ${CACHE_DB_NAME:}
      username: ${CACHE_DB_USERNAME:}
      password: ${CACHE_DB_PASSWORD:}
      ssl-mode: ${CACHE_DB_SSL_MODE:verify-full}
      schema: ${CACHE_DB_SCHEMA:firefly_insurance_experience_cache}
      cache-table: cache_entries
      auto-create-schema: false
      min-pool-size: 1
      max-pool-size: 2
      connect-timeout: 5s
      acquire-timeout: 5s
      initialization-timeout: 15s
      shutdown-timeout: 5s

server:
  port: ${SERVER_PORT:8108}

api-configuration:
  domain-platform:
    security-center:
      base-path: ${ENDPOINT_DOMAIN_CORE_SECURITY_CENTER:http://localhost:8085}
    lending-credit-scoring:
      base-path: ${ENDPOINT_DOMAIN_LENDING_CREDIT_SCORING:http://localhost:8042}
    insurance-underwriting:
      base-path: ${ENDPOINT_DOMAIN_INSURANCE_UNDERWRITING:http://localhost:8073}
    insurance-policies:
      base-path: ${ENDPOINT_DOMAIN_INSURANCE_POLICIES:http://localhost:8071}
    insurance-claims:
      base-path: ${ENDPOINT_DOMAIN_INSURANCE_CLAIMS:http://localhost:8072}

management:
  endpoints:
    web:
      exposure:
        include: health,info
